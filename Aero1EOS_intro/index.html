<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body {
    margin: 0;
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* Warning Toast Style */
  #portrait-warning {
    position: absolute;
    top: 20px;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    color: white;
    font-size: 12px;
    z-index: 1000;
    display: none; /* Hidden by default */
  }

  /* Only show warning if in portrait */
  @media screen and (orientation:portrait) {
    #portrait-warning { display: block; }
  }

  /* Liquid Glass Text Intro */
  .intro-text {
    position: absolute;
    /* Used 'vw' so it scales based on screen width */
    font-size: 15vw; 
    font-weight: 800;
    color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
    animation: liquid 4s ease-in-out forwards;
    letter-spacing: -2px;
    pointer-events: none;
    /* Ensure the text doesn't wrap awkwardly */
    white-space: nowrap; 
  }

  @keyframes liquid {
    0% { opacity: 0; transform: scale(0.8); filter: blur(20px); }
    50% { opacity: 1; transform: scale(1); filter: blur(0px); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.2); filter: blur(20px); }
  }

  .gallery {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: fadeInGallery 2s ease-in-out 3.5s forwards;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Changed to contain so it doesn't cut off */
  }

  .slide.active { opacity: 1; }
  @keyframes fadeInGallery { to { opacity: 1; } }
</style>
</head>
<body>

  <div id="portrait-warning">Rotate for better view</div>
  <div class="intro-text">Aero1EOS</div>

  <div class="gallery">
    <div class="slide active"><img src="IMG_3223.jpeg"></div>
    <div class="slide"><img src="IMG_3224.jpeg"></div>
    <div class="slide"><img src="IMG_3225.jpeg"></div>
  </div>

<script>
  let slides = document.querySelectorAll('.slide');
  let index = 0;
  function cycle() {
    slides[index].classList.remove('active');
    index = (index + 1) % slides.length;
    slides[index].classList.add('active');
  }
  setInterval(cycle, 5000);
</script>

</body>
</html>
